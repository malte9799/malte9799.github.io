<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Send German-speaking visitors to /de/ unless they picked a language before.
      try {
        var pref = localStorage.getItem('lang');
        if (pref === 'de' || (!pref && /^de\b/i.test(navigator.language || '')))
          location.replace('/de' + location.pathname + location.search + location.hash);
      } catch (e) {}
    </script>
    <title>Malte — Software for the browser</title>
    <meta name="description" content="Malte builds tools that feel like native apps and run in a browser tab: paint.net web, FactorioTools and a puzzle arcade." />
    <meta property="og:title" content="Malte — Software for the browser" />
    <meta property="og:description" content="paint.net web, FactorioTools, puzzle games and more. No installs, no servers." />
    <meta property="og:image" content="https://malte9799.github.io/img/paintnet.webp" />
    <meta property="og:locale" content="en_US" />
    <link rel="alternate" hreflang="en" href="https://malte9799.github.io/" />
    <link rel="alternate" hreflang="de" href="https://malte9799.github.io/de/" />
    <link rel="alternate" hreflang="x-default" href="https://malte9799.github.io/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript. You can still open the <a href="/games/">games</a>, <a href="https://malte9799.github.io/paint.net/">paint.net web</a> or <a href="https://malte9799.github.io/FactorioTools/">FactorioTools</a>.</noscript>
    <script type="module" src="/src/landing/main.jsx"></script>
  </body>
</html>
