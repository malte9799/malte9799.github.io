<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0f101e" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="themes.css" />
<link rel="stylesheet" href="shared.css" />
<style>
  #home {
    max-width: 1080px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  #home .hero { display: block; text-align: center; margin-bottom: 44px; }
  #home h1 { font-family: var(--font-display); font-weight: var(--title-weight); letter-spacing: var(--title-tracking); text-transform: var(--title-transform); }
  #home .hero .site-link { display: inline-flex; }
  #home .site-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 500; color: var(--muted);
    text-decoration: none; margin: -8px -8px 14px; padding: 8px; transition: color 0.15s;
  }
  #home .site-link:hover { color: var(--ink); }
  #home h1 {
    font-size: var(--hero-size);
    line-height: 1.05;
    margin: 0 0 12px;
    background: var(--hero-fill);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #home .subtitle {
    font-size: 17px;
    color: var(--muted);
    margin: 0;
  }
  #home .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 640px) { #home .grid { grid-template-columns: 1fr; } #home { padding-top: 44px; } }
  @media (min-width: 641px) and (max-width: 900px) { #home .grid { grid-template-columns: repeat(2, 1fr); } }

  #home .card {
    position: relative;
    display: flex;
    flex-direction: column;
    border-radius: var(--r-xl);
    overflow: hidden;
    border: var(--border-w) solid var(--hairline);
    background: var(--card-bg);
    text-decoration: none;
    color: inherit;
    transition: transform 0.25s var(--ease), border-color 0.2s, box-shadow 0.25s var(--ease);
    box-shadow: var(--card-shadow);
  }
  #home .card:hover {
    transform: var(--card-hover-lift);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--hairline));
    box-shadow: var(--card-hover-shadow);
  }
  #home .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #home .card .preview {
    position: relative;
    aspect-ratio: 5 / 3;
    background: var(--board);
    overflow: hidden;
  }
  #home .card canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
    position: absolute;
    inset: 0;
    transition: transform 0.4s var(--ease);
  }
  #home .card:hover canvas { transform: scale(1.035); }
  #home .card-text {
    padding: 14px 18px 16px;
    border-top: var(--border-w) solid var(--hairline);
  }
  #home .card-title {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: var(--title-tracking);
    color: var(--ink);
    line-height: 1.25;
  }
  #home .card-desc {
    font-size: 14px;
    color: var(--muted);
    margin-top: 2px;
  }
  #home .star-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    width: 34px;
    height: 34px;
    flex: none;
    border-radius: 50%;
    background: var(--chip-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.2s var(--ease), transform 0.2s var(--ease), background-color 0.2s, border-color 0.2s, color 0.2s;
    color: var(--muted);
    padding: 0;
  }
  #home .card:hover .star-btn { opacity: 0.85; transform: scale(1); }
  #home .star-btn:hover {
    opacity: 1 !important;
    color: var(--sun);
    background: var(--chip-bg);
    border-color: color-mix(in srgb, var(--sun) 45%, transparent);
    transform: scale(1.08) !important;
  }
  #home .star-btn.starred {
    opacity: 1 !important;
    transform: scale(1) !important;
    color: var(--sun);
    border-color: color-mix(in srgb, var(--sun) 30%, transparent);
  }
  #home .star-btn:active { transform: scale(0.95) !important; }
  #home .star-btn:focus-visible {
    outline: 2px solid var(--sun);
    outline-offset: 2px;
    opacity: 1 !important;
    transform: scale(1) !important;
  }
  #home .star-btn .star-icon {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linejoin: round;
    transition: fill 0.25s var(--ease), transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #home .star-btn.starred .star-icon { fill: var(--sun); transform: scale(1.1); }
  #home .star-btn:active .star-icon { transform: scale(0.85); }
  @media (hover: none) {
    #home .star-btn { opacity: 0.7; transform: scale(1); }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="themes.js"></script>
<script src="game.js"></script>
</head>
<body>
<div id="home">
  <header class="hero">
    <svg class="art-lines" viewBox="0 0 800 360" aria-hidden="true">
      <rect pathLength="1" style="--d:0" x="300" y="50" width="200" height="200" rx="6" />
      <path pathLength="1" style="--d:2" d="M367 50V250M433 50V250M300 117H500M300 183H500" />
      <circle pathLength="1" class="spin" style="--d:4" cx="333" cy="83" r="20" />
      <path pathLength="1" class="spin-r spin" style="--d:5" d="M382 132L418 168M418 132L382 168" />
      <circle pathLength="1" class="spin" style="--d:6" cx="467" cy="216" r="20" />
      <path pathLength="1" class="spin-r spin" style="--d:7" d="M315 198L351 234M351 198L315 234" />
      <path pathLength="1" style="--d:3" d="M20 300q40-70 80 0t80 0 80 0 80 0" />
      <path pathLength="1" style="--d:8" d="M20 300q40-70 80 0t80 0 80 0 80 0" transform="translate(0 20)" />
      <circle pathLength="1" style="--d:5" cx="650" cy="130" r="64" />
      <circle pathLength="1" style="--d:6" cx="650" cy="130" r="42" />
      <circle pathLength="1" style="--d:7" cx="650" cy="130" r="20" />
      <path pathLength="1" style="--d:8" d="M560 130H740M650 40V220" />
      <rect pathLength="1" class="spin" style="--d:9" x="580" y="260" width="70" height="70" rx="14" />
      <circle pathLength="1" style="--d:10" cx="600" cy="280" r="3" />
      <circle pathLength="1" style="--d:10" cx="615" cy="295" r="3" />
      <circle pathLength="1" style="--d:10" cx="630" cy="310" r="3" />
      <path pathLength="1" style="--d:9" d="M60 60l60-40 60 40-60 40zM60 60v50l60 40V100M180 60v50l-60 40" />
    </svg>
    <a class="site-link" href="/">← malte9799</a>
    <h1 data-text="Games">Games</h1>
    <p class="subtitle">small puzzles &amp; toys, made by malte</p>
  </header>

  <div class="grid" id="grid"></div>
</div>
<div id="app" style="display:none"></div>

<script>
// Router: ?game=<id> loads that game into the shared shell (game.js builds
// the UI into #app); no param shows the home card grid from manifest.js.
//
// Game ideas that would fit this collection (grid/puzzle games, p5 canvas,
// same "Midnight" theme (PAL in game.js) — add via games/<id>.js + a manifest.js entry):
//   - Sokoban        — push crates onto targets, undo-heavy puzzling
//   - 15-Puzzle      — sliding tiles into order, with a picture mode
//   - Memory Pairs   — flip two cards, match symbols, count the tries
//   - Mastermind     — guess the hidden color code from peg feedback
//   - Simon          — repeat an ever-growing flashing sequence
//   - Takuzu (0/1)   — fill a binary grid, no triples, equal counts
//   - Peg Solitaire  — jump pegs to leave just one standing
//   - Tents & Trees  — place a tent next to every tree, row/col clues
//   - Hashi (Bridges)— connect numbered islands with 1-2 bridges
//   - Tower of Hanoi — move the stack, never a big disc on a small one
//   - Breakout/Pong  — arcade sibling for Snake in fullscreen mode
//   - Wordle-like    — daily word guess with keyboard heatmap

const _gameName = new URLSearchParams(location.search).get("game");

function loadScript(src, onload, onerror) {
  const s = document.createElement("script");
  s.src = src;
  if (onload) s.onload = onload;
  if (onerror) s.onerror = onerror;
  document.body.appendChild(s);
}

if (_gameName) {
  // Game view: hide the home grid, let game.js build the shell into #app,
  // then dynamically load the selected game's script.
  document.title = _gameName.charAt(0).toUpperCase() + _gameName.slice(1);
  document.getElementById("home").style.display = "none";
  document.getElementById("app").style.display = "";
  // only plain ids, so ?game= can't point the loader at another path
  const ok = /^[a-z0-9-]+$/i.test(_gameName);
  const notFound = () => {
    document.getElementById("app").innerHTML =
      `<a class="back-link" href="index.html">← Games</a><header><h1>Not found</h1></header>` +
      `<p class="tag" style="text-align:left">There's no game called “${_gameName.replace(/[<>&"]/g, "")}”.</p>`;
  };
  if (ok) loadScript("games/" + _gameName + ".js", null, notFound);
  else notFound();
} else {
  // Home view: manifest.js (registry + previews) and home.js (card grid)
  // are only loaded here so their globals never collide with a running game.
  loadScript("manifest.js", () => loadScript("home.js", () => buildHome()));

  // line art follows the pointer a little (Brutal design; harmless otherwise)
  const _home = document.getElementById("home");
  if (matchMedia("(hover: hover) and (prefers-reduced-motion: no-preference)").matches) {
    addEventListener("pointermove", (e) => {
      _home.style.setProperty("--mx", (e.clientX / innerWidth - 0.5).toFixed(3));
      _home.style.setProperty("--my", (e.clientY / innerHeight - 0.5).toFixed(3));
    }, { passive: true });
  }
}
</script>
</body>
</html>
