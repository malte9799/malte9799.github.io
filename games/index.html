<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0f101e" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="shared.css" />
<style>
  #home {
    max-width: 1080px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  #home .hero { display: block; text-align: center; margin-bottom: 44px; }
  #home .hero .site-link { display: inline-flex; }
  #home .site-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 500; color: var(--muted);
    text-decoration: none; margin: -8px -8px 14px; padding: 8px; transition: color 0.15s;
  }
  #home .site-link:hover { color: var(--ink); }
  #home h1 {
    font-size: clamp(44px, 8vw, 72px);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1;
    margin: 0 0 12px;
    background: linear-gradient(100deg, #ffd99a 0%, #ffb0c2 35%, #c8b6ff 65%, #9fe8ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #home .subtitle {
    font-size: 17px;
    color: var(--muted);
    margin: 0;
  }
  #home .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 640px) { #home .grid { grid-template-columns: 1fr; } #home { padding-top: 44px; } }
  @media (min-width: 641px) and (max-width: 900px) { #home .grid { grid-template-columns: repeat(2, 1fr); } }

  #home .card {
    position: relative;
    display: flex;
    flex-direction: column;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.07);
    background: linear-gradient(180deg, rgba(40, 44, 78, 0.55), rgba(28, 31, 54, 0.55));
    text-decoration: none;
    color: inherit;
    transition: transform 0.25s var(--ease), border-color 0.2s, box-shadow 0.25s var(--ease);
    box-shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.8);
  }
  #home .card:hover {
    transform: translateY(-4px);
    border-color: rgba(176, 152, 255, 0.35);
    box-shadow: 0 22px 50px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(176, 152, 255, 0.12), 0 10px 40px -10px rgba(176, 152, 255, 0.25);
  }
  #home .card:focus-visible { outline: 2px solid var(--lilac); outline-offset: 3px; }
  #home .card .preview {
    position: relative;
    aspect-ratio: 5 / 3;
    background: var(--board);
    overflow: hidden;
  }
  #home .card canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
    position: absolute;
    inset: 0;
    transition: transform 0.4s var(--ease);
  }
  #home .card:hover canvas { transform: scale(1.035); }
  #home .card-text {
    padding: 14px 18px 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
  }
  #home .card-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1.25;
  }
  #home .card-desc {
    font-size: 14px;
    color: var(--muted);
    margin-top: 2px;
  }
  #home .star-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    width: 34px;
    height: 34px;
    flex: none;
    border-radius: 50%;
    background: rgba(15, 16, 30, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.2s var(--ease), transform 0.2s var(--ease), background-color 0.2s, border-color 0.2s, color 0.2s;
    color: var(--muted);
    padding: 0;
  }
  #home .card:hover .star-btn { opacity: 0.85; transform: scale(1); }
  #home .star-btn:hover {
    opacity: 1 !important;
    color: var(--sun);
    background: rgba(15, 16, 30, 0.8);
    border-color: rgba(255, 204, 112, 0.45);
    transform: scale(1.08) !important;
  }
  #home .star-btn.starred {
    opacity: 1 !important;
    transform: scale(1) !important;
    color: var(--sun);
    border-color: rgba(255, 204, 112, 0.3);
  }
  #home .star-btn:active { transform: scale(0.95) !important; }
  #home .star-btn:focus-visible {
    outline: 2px solid var(--sun);
    outline-offset: 2px;
    opacity: 1 !important;
    transform: scale(1) !important;
  }
  #home .star-btn .star-icon {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linejoin: round;
    transition: fill 0.25s var(--ease), transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #home .star-btn.starred .star-icon { fill: var(--sun); transform: scale(1.1); }
  #home .star-btn:active .star-icon { transform: scale(0.85); }
  @media (hover: none) {
    #home .star-btn { opacity: 0.7; transform: scale(1); }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="game.js"></script>
</head>
<body>
<div id="home">
  <header class="hero">
    <a class="site-link" href="/">← malte9799</a>
    <h1>Games</h1>
    <p class="subtitle">small puzzles &amp; toys, made by malte</p>
  </header>

  <div class="grid" id="grid"></div>
</div>
<div id="app" style="display:none"></div>

<script>
// Router: ?game=<id> loads that game into the shared shell (game.js builds
// the UI into #app); no param shows the home card grid from manifest.js.
//
// Game ideas that would fit this collection (grid/puzzle games, p5 canvas,
// same "Midnight" theme (PAL in game.js) — add via games/<id>.js + a manifest.js entry):
//   - Sokoban        — push crates onto targets, undo-heavy puzzling
//   - 15-Puzzle      — sliding tiles into order, with a picture mode
//   - Memory Pairs   — flip two cards, match symbols, count the tries
//   - Mastermind     — guess the hidden color code from peg feedback
//   - Simon          — repeat an ever-growing flashing sequence
//   - Takuzu (0/1)   — fill a binary grid, no triples, equal counts
//   - Peg Solitaire  — jump pegs to leave just one standing
//   - Tents & Trees  — place a tent next to every tree, row/col clues
//   - Hashi (Bridges)— connect numbered islands with 1-2 bridges
//   - Tower of Hanoi — move the stack, never a big disc on a small one
//   - Breakout/Pong  — arcade sibling for Snake in fullscreen mode
//   - Wordle-like    — daily word guess with keyboard heatmap

const _gameName = new URLSearchParams(location.search).get("game");

function loadScript(src, onload, onerror) {
  const s = document.createElement("script");
  s.src = src;
  if (onload) s.onload = onload;
  if (onerror) s.onerror = onerror;
  document.body.appendChild(s);
}

if (_gameName) {
  // Game view: hide the home grid, let game.js build the shell into #app,
  // then dynamically load the selected game's script.
  document.title = _gameName.charAt(0).toUpperCase() + _gameName.slice(1);
  document.getElementById("home").style.display = "none";
  document.getElementById("app").style.display = "";
  // only plain ids, so ?game= can't point the loader at another path
  const ok = /^[a-z0-9-]+$/i.test(_gameName);
  const notFound = () => {
    document.getElementById("app").innerHTML =
      `<a class="back-link" href="index.html">← Games</a><header><h1>Not found</h1></header>` +
      `<p class="tag" style="text-align:left">There's no game called “${_gameName.replace(/[<>&"]/g, "")}”.</p>`;
  };
  if (ok) loadScript("games/" + _gameName + ".js", null, notFound);
  else notFound();
} else {
  // Home view: manifest.js (registry + previews) and home.js (card grid)
  // are only loaded here so their globals never collide with a running game.
  loadScript("manifest.js", () => loadScript("home.js", () => buildHome()));
}
</script>
</body>
</html>
